[package]
name = "project-thermo"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
