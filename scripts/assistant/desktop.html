<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Project CAD Assistant</title>
    <style nonce="__NONCE__">
      :root {
        color-scheme: dark light;
        --bg: #131c18;
        --surface: #1c2821;
        --line: #314138;
        --ink: #e7eee9;
        --muted: #a3b2a8;
        --accent: #79baa0;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      body {
        margin: 0;
        min-height: 100svh;
        padding: clamp(16px, 5vh, 48px) 20px;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.45 system-ui,
          sans-serif;
      }
      main {
        width: min(100%, 580px);
      }
      header,
      .agent,
      .actions,
      footer {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      header {
        margin-bottom: 28px;
      }
      .logo {
        width: 42px;
        height: 42px;
        flex: none;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: -0.5px;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 17px;
      }
      p {
        margin: 4px 0 0;
      }
      .small,
      .detail {
        color: var(--muted);
        font-size: 13px;
      }
      .connection {
        margin-left: auto;
        color: var(--muted);
        display: flex;
        gap: 7px;
        align-items: center;
        font-size: 12px;
        white-space: nowrap;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #cf9064;
      }
      [data-running="true"] .dot {
        background: var(--accent);
      }
      .card,
      .approval {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 20px;
        background: var(--surface);
      }
      .approval {
        margin-bottom: 14px;
      }
      .approval p {
        overflow-wrap: anywhere;
        color: var(--muted);
        font-size: 13px;
      }
      .approval .actions {
        margin-top: 16px;
      }
      .agent-icon {
        width: 40px;
        height: 40px;
        color: #9cb4f7;
        background: var(--bg);
        border-radius: 10px;
        padding: 8px;
        flex: none;
      }
      .agent-copy {
        flex: 1;
        min-width: 0;
      }
      .agent-name {
        font-weight: 650;
      }
      [data-phase="ready"] .detail {
        color: var(--accent);
      }
      button {
        font: inherit;
        font-size: 13px;
        font-weight: 550;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 13px;
        color: var(--ink);
        background: transparent;
        cursor: pointer;
      }
      button:hover {
        background: color-mix(in srgb, var(--accent) 12%, transparent);
      }
      button:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .primary {
        background: var(--accent);
        color: #10291f;
        border-color: transparent;
      }
      .primary:hover {
        background: color-mix(in srgb, var(--accent) 85%, white);
      }
      .return {
        width: 100%;
        margin-top: 18px;
        padding: 12px;
        font-size: 14px;
      }
      #message {
        color: var(--muted);
        font-size: 13px;
        overflow-wrap: anywhere;
        margin-top: 12px;
        max-height: 90px;
        overflow: auto;
      }
      #message:empty {
        display: none;
      }
      #message.error {
        color: #f4b49a;
      }
      details {
        border-top: 1px solid var(--line);
        margin-top: 24px;
        padding-top: 16px;
      }
      summary {
        cursor: pointer;
        font-size: 13px;
        color: var(--muted);
      }
      .settings-fields {
        display: grid;
        gap: 12px;
        padding-top: 14px;
        max-height: 220px;
        overflow: auto;
      }
      label {
        display: grid;
        gap: 5px;
        font-size: 13px;
      }
      input[type="url"] {
        width: 100%;
        font: inherit;
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
        padding: 9px;
        border-radius: 7px;
      }
      .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      input {
        accent-color: var(--accent);
      }
      footer {
        margin-top: 14px;
        gap: 16px;
        flex-wrap: wrap;
      }
      footer button {
        font-size: 12px;
        border: 0;
        color: var(--muted);
        padding: 0;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f5f8f6;
          --surface: #fff;
          --line: #dbe4de;
          --ink: #233c30;
          --muted: #657b6d;
          --accent: #79baa0;
        }
      }
      @media (max-height: 650px) {
        body {
          padding-block: 16px;
        }
        header {
          margin-bottom: 18px;
        }
        details {
          margin-top: 18px;
        }
        .settings-fields {
          max-height: 130px;
        }
      }
      @media (max-width: 420px) {
        body {
          padding-inline: 14px;
        }
        header {
          gap: 10px;
        }
        .connection {
          font-size: 11px;
        }
        .card {
          padding: 16px;
        }
        .agent {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <svg class="logo" viewBox="0 0 128 128" aria-hidden="true">
          <rect width="128" height="128" rx="30" fill="#276f5b" />
          <g fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round">
            <rect x="28" y="28" width="27" height="27" rx="5" />
            <rect x="73" y="73" width="27" height="27" rx="5" />
            <path d="M42 55v30h31M55 42h32v31" />
          </g>
        </svg>
        <div>
          <h1>Project CAD</h1>
          <p class="small">Muse connector</p>
        </div>
        <div class="connection" id="connection">
          <span class="dot"></span><span id="state">Starting…</span>
        </div>
      </header>
      <section
        class="approval"
        id="approval"
        hidden
        aria-labelledby="approval-title"
      >
        <h2 id="approval-title">Connect this website?</h2>
        <p id="request-origin"></p>
        <div class="actions">
          <button class="primary" id="approve">Approve connection</button
          ><button id="deny">Decline</button>
        </div>
      </section>
      <section class="card" aria-label="Muse Code">
        <div class="agent" data-agent-row="muse">
          <svg
            class="agent-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            aria-hidden="true"
          >
            <path
              d="m12 2 2.6 7.4L22 12l-7.4 2.6L12 22l-2.6-7.4L2 12l7.4-2.6Z"
            />
          </svg>
          <div class="agent-copy">
            <div class="agent-name">Muse Code</div>
            <p class="detail" data-status="muse">Preparing Muse…</p>
          </div>
          <button id="signin" data-provider="muse">Checking…</button>
        </div>
      </section>
      <button class="primary return" id="return">Return to project →</button>
      <div id="message" role="status" aria-live="polite"></div>
      <details id="settings">
        <summary>Settings</summary>
        <div class="settings-fields">
          <label
            >Project CAD website<input id="website" type="url" required
          /></label>
          <label class="checkbox"
            ><input id="autostart" type="checkbox" />Start at login</label
          >
          <button id="save">Save settings</button>
          <button id="uninstall" data-action="uninstall" hidden>
            Uninstall connector…
          </button>
        </div>
      </details>
      <footer>
        <button id="refresh">Refresh</button
        ><button data-action="logs">Logs</button
        ><button id="toggle" data-action="start">Start connector</button>
      </footer>
    </main>
    <script nonce="__NONCE__">
      const $ = (id) => document.getElementById(id);
      let initialized = false,
        busy = false,
        refreshing = false,
        pendingConnection = null,
        projectOrigin = "";
      function message(text, error = false) {
        $("message").textContent = text;
        $("message").className = error ? "error" : "";
      }
      async function refresh() {
        if (refreshing) return;
        refreshing = true;
        try {
          const response = await fetch("/api/state", { cache: "no-store" });
          const value = await response.json();
          if (!response.ok) throw Error(value.error || "Reopen the connector.");
          $("uninstall").hidden = !value.canUninstall;
          $("state").textContent = value.running ? "Running" : "Stopped";
          $("connection").dataset.running = String(value.running);
          $("toggle").textContent = value.running
            ? "Stop connector"
            : "Start connector";
          $("toggle").dataset.action = value.running ? "stop" : "start";
          $("toggle").disabled = busy || (value.running && !value.managed);
          pendingConnection = value.connections?.[0] || null;
          $("approval").hidden = !pendingConnection;
          if (pendingConnection) {
            $("request-origin").textContent = pendingConnection.origin;
            projectOrigin = pendingConnection.origin;
          }
          if (!projectOrigin) projectOrigin = new URL(value.websiteUrl).origin;
          const state = value.providerSetup?.muse,
            row = document.querySelector("[data-agent-row=muse]");
          row.dataset.phase = state?.phase || "checking";
          row.querySelector("[data-status]").textContent =
            state?.message || "Preparing Muse…";
          $("signin").hidden = state?.phase === "ready";
          $("signin").disabled =
            busy || !state || ["checking", "installing"].includes(state.phase);
          $("signin").textContent =
            state?.phase === "signing-in"
              ? "Sign in"
              : state?.phase === "error"
                ? "Retry"
                : state?.phase === "installing"
                  ? "Installing…"
                  : "Checking…";
          if (!initialized) {
            $("website").value = value.websiteUrl;
            $("autostart").checked = value.startAtLogin;
            initialized = true;
          }
          if (value.message) message(value.message, true);
        } finally {
          refreshing = false;
        }
      }
      async function action(body) {
        busy = true;
        document.querySelectorAll("button").forEach((b) => (b.disabled = true));
        message("");
        try {
          const response = await fetch("/api/action", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-Project-CAD-Desktop": "1",
            },
            body: JSON.stringify(body),
          });
          const value = await response.json();
          if (!response.ok) throw Error(value.error || "Please try again.");
          if (!["approve-connection", "signin"].includes(body.action))
            message(value.message || "");
          if (body.action === "settings") $("settings").open = false;
        } catch (error) {
          message(error.message, true);
        } finally {
          busy = false;
          document
            .querySelectorAll("button")
            .forEach((b) => (b.disabled = false));
          await refresh().catch((error) => message(error.message, true));
        }
      }
      document
        .querySelectorAll("[data-action]")
        .forEach(
          (b) => (b.onclick = () => action({ action: b.dataset.action })),
        );
      $("signin").onclick = () =>
        action({ action: "signin", provider: "muse" });
      $("approve").onclick = () =>
        pendingConnection &&
        action({ action: "approve-connection", id: pendingConnection.id });
      $("deny").onclick = () =>
        pendingConnection &&
        action({ action: "deny-connection", id: pendingConnection.id });
      $("return").onclick = () => {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(
            { type: "project-cad-return" },
            projectOrigin,
          );
          window.opener.focus();
        } else {
          action({ action: "open" });
        }
      };
      $("refresh").onclick = () =>
        refresh().catch((error) => message(error.message, true));
      $("save").onclick = () =>
        $("website").reportValidity() &&
        action({
          action: "settings",
          websiteUrl: $("website").value,
          startAtLogin: $("autostart").checked,
        });
      refresh().catch((error) => message(error.message, true));
      setInterval(() => {
        if (!busy && !document.hidden)
          refresh().catch((error) => message(error.message, true));
      }, 2500);
      window.addEventListener("focus", () => {
        if (!busy) refresh().catch((error) => message(error.message, true));
      });
    </script>
  </body>
</html>
